name: Publish

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Define release type: patch, minor, or major'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
            ref: master
            fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: 24
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install Packages
        run: npm i --ignore-scripts
      - name: Run Tests
        run: npm test
      - name: Audit Signatures
        run: npm audit signatures
      - name: Bump Versions
        run: npx lerna version ${{ github.event.inputs.release-type }} --force-publish -y --no-push
      - name: Publish Package
        run: npx lerna publish from-package -y
      - name: Create Release Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # 8.1.1
        with:
          branch: chore/release-${{ github.run_id }}
          base: master
          title: "Release: publish ${{ github.event.inputs.release-type }}"
          commit-message: "Updates versions after publish"
          body: |
            This PR captures version bumps generated during the publish workflow.